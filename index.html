<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Situation de jour</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="header-content"><div class="header-text"><div class="brand">Maroc Telecom</div><h1>Situation de jour</h1><div class="date" id="date"></div></div><img class="brand-icon" src="logo.png" alt="Icône Maroc Telecom"></div></header>
<div class="wrap"><div id="app"></div><div class="actions"><button class="action copy" id="copyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copier</span></button><button class="action send" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg><span>Envoyer</span></button></div><div class="toast" id="toast"></div><button class="reset" id="resetBtn">Remettre tout à zéro</button></div>
<div class="modal" id="loginModal"><div class="modal-box"><h3 class="modal-title">Envoyer la situation</h3><p class="modal-sub">Entrez votre nom d'utilisateur et votre mot de passe.</p><input class="field" id="username" type="text" autocomplete="username" placeholder="Nom d'utilisateur"><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="modal-actions"><button class="modal-btn cancel" id="cancelLogin">Annuler</button><button class="modal-btn login" id="loginBtn">Envoyer</button></div><div class="small">La situation sera enregistrée dans votre tableau.</div></div></div>
<script src="script.js"></script>
</body>
</html>
