<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Situation de jour</title>
<link rel="icon" href="logo.png" type="image/png">
<style>
:root{--red:#e30613;--red-d:#b8040f;--red-l:#fdecee;--bg:#f5f5f7;--card:#fff;--text:#1c1c24;--muted:#7a7a88;--b:#ececf0;--sh:0 2px 10px rgba(0,0,0,.06);box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151a;--card:#1f1f26;--text:#f2f2f5;--muted:#9a9aa8;--b:#2e2e38;--red-l:#3a1519}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 56px;border-radius:0 0 28px 28px}
.header-content{display:flex;align-items:center;justify-content:space-between;gap:16px}.header-text{min-width:0}.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;font-weight:600}h1{margin:6px 0 2px;font-size:24px;font-weight:700}.date{font-size:13px;opacity:.9;text-transform:capitalize}.brand-icon{width:150px;height:76px;object-fit:contain;flex:0 0 auto;border-radius:12px}
@media(max-width:420px){.brand-icon{width:58px;height:58px}h1{font-size:21px}}
.wrap{max-width:480px;margin:-36px auto 0;padding:0 16px 28px}.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px 16px 6px;margin-bottom:16px}.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px;font-weight:700}h2:before{content:"";width:4px;height:18px;background:var(--red);border-radius:2px}.total{background:var(--red-l);color:var(--red);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--b)}.row:first-of-type{border-top:0}.name{flex:1;font-weight:600;font-size:16px}.num{min-width:38px;text-align:center;font-size:24px;font-weight:800;color:var(--text)}.num.on{color:var(--red)}button{border:0;font-family:inherit;cursor:pointer;transition:transform .08s}button:active{transform:scale(.92)}.rb{width:44px;height:44px;border-radius:50%;font-size:24px;font-weight:600;line-height:1}.plus{background:var(--red);color:#fff;box-shadow:0 3px 8px rgba(227,6,19,.35)}.minus{background:var(--card);color:var(--red);border:2px solid var(--red)}
.action{width:100%;height:54px;border-radius:16px;color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(227,6,19,.35);margin-top:10px}.copy{background:var(--red)}.send{background:#17843b}.reset{width:100%;height:44px;margin-top:10px;border-radius:14px;background:transparent;color:var(--muted);border:1px solid var(--b);font-size:14px}.reset.armed{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}.toast{text-align:center;color:var(--red);font-weight:700;min-height:22px;margin-top:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{width:100%;max-width:390px;background:var(--card);border-radius:22px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}.modal-title{font-size:20px;font-weight:800;margin:0 0 5px}.modal-sub{font-size:13px;color:var(--muted);margin:0 0 18px}.field{width:100%;height:48px;border:1px solid var(--b);border-radius:12px;background:var(--bg);color:var(--text);padding:0 14px;font-size:16px;margin-bottom:12px;outline:none}.field:focus{border-color:var(--red)}.modal-actions{display:flex;gap:10px;margin-top:4px}.modal-btn{height:46px;border-radius:12px;flex:1;font-size:15px;font-weight:700}.cancel{background:transparent;border:1px solid var(--b);color:var(--text)}.login{background:var(--red);color:#fff}.small{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}

/* ===== Boutons professionnels ===== */
button{-webkit-appearance:none;appearance:none;transition:transform .12s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease,color .18s ease,filter .18s ease;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:3px solid rgba(227,6,19,.35);outline-offset:2px}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
button svg{width:20px;height:20px;flex:0 0 auto}

/* Compteurs + / − */
.rb{width:44px;height:44px;border-radius:12px;font-size:22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0}
.plus{background:linear-gradient(180deg,var(--red),var(--red-d));box-shadow:0 2px 6px rgba(227,6,19,.28),inset 0 1px 0 rgba(255,255,255,.18)}
.minus{background:var(--red-l);color:var(--red);border:1px solid transparent;box-shadow:none}
@media (hover:hover){.plus:hover{filter:brightness(1.07);box-shadow:0 4px 12px rgba(227,6,19,.35),inset 0 1px 0 rgba(255,255,255,.18)}.minus:hover{border-color:var(--red)}}
.rb:active{transform:scale(.94)}
.num{font-variant-numeric:tabular-nums}

/* Actions principales */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.action{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;margin-top:0;border-radius:14px;font-size:15px;font-weight:600;letter-spacing:.01em}
.action.copy{background:var(--card);color:var(--red);border:1.5px solid var(--red);box-shadow:none}
.action.send{background:linear-gradient(180deg,#e30613,#b8040f);color:#fff;border:0;box-shadow:0 4px 12px rgba(227,6,19,.32),inset 0 1px 0 rgba(255,255,255,.18)}
@media (hover:hover){.action.copy:hover{background:var(--red-l)}.action.send:hover{filter:brightness(1.07);box-shadow:0 6px 16px rgba(227,6,19,.38),inset 0 1px 0 rgba(255,255,255,.18)}}
.action:active{transform:scale(.97)}

/* Réinitialiser */
.reset{height:42px;margin-top:12px;border-radius:12px;font-size:13px;font-weight:500;border:1px solid var(--b);background:transparent;color:var(--muted)}
@media (hover:hover){.reset:not(.armed):hover{color:var(--red);border-color:var(--red)}}
.reset.armed{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}

/* Modal */
.modal-btn{height:48px;border-radius:12px;font-size:15px;font-weight:600}
.modal-btn.cancel{background:transparent;border:1px solid var(--b);color:var(--muted)}
.modal-btn.login{background:linear-gradient(180deg,#e30613,#b8040f);color:#fff;box-shadow:0 4px 12px rgba(227,6,19,.3)}
@media (hover:hover){.modal-btn.cancel:hover{color:var(--text);border-color:var(--muted)}.modal-btn.login:hover{filter:brightness(1.07)}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<header><div class="header-content"><div class="header-text"><div class="brand">Maroc Telecom</div><h1>Situation de jour</h1><div class="date" id="date"></div></div><img class="brand-icon" src="logo.png" alt="Icône Maroc Telecom"></div></header>
<div class="wrap"><div id="app"></div><div class="actions"><button class="action copy" id="copyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copier</span></button><button class="action send" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg><span>Envoyer</span></button></div><div class="toast" id="toast"></div><button class="reset" id="resetBtn">Remettre tout à zéro</button></div>
<div class="modal" id="loginModal"><div class="modal-box"><h3 class="modal-title">Envoyer la situation</h3><p class="modal-sub">Entrez votre nom d'utilisateur et votre mot de passe.</p><input class="field" id="username" type="text" autocomplete="username" placeholder="Nom d'utilisateur"><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="modal-actions"><button class="modal-btn cancel" id="cancelLogin">Annuler</button><button class="modal-btn login" id="loginBtn">Envoyer</button></div><div class="small">La situation sera enregistrée dans votre tableau.</div></div></div>
<script>
// ⚠️ Remplacez par l'URL de votre Web App (doit finir par /exec)
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzut1b1ABNY9L9jkSlMfGcmxV0CfEvhHDVnd03LwZ-vzmlZSfEr4RUC8nsX6MNxILuzEg/exec";

const groups=[
 {title:"Installations",items:["G-DEG","G-IAM","RTC-DEG","RTC-IAM"]},
 {title:"Dérangements",items:["FIXE","ADSL-IAM","GPON-IAM","GPON-DEG"]}
];
let counts={};try{counts=JSON.parse(localStorage.getItem("sit_counts")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("sit_counts",JSON.stringify(counts))}catch(e){}};
const get=k=>counts[k]||0;
document.getElementById("date").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function render(){const app=document.getElementById("app");app.innerHTML="";groups.forEach(g=>{const total=g.items.reduce((s,n)=>s+get(g.title+"|"+n),0);const card=document.createElement("div");card.className="card";card.innerHTML=`<div class="card-h"><h2>${g.title}</h2><span class="total">Total ${total}</span></div>`;g.items.forEach(n=>{const k=g.title+"|"+n,v=get(k);const row=document.createElement("div");row.className="row";row.innerHTML=`<span class="name">${n}</span><button class="rb minus" aria-label="Moins">−</button><span class="num${v?" on":""}">${v}</span><button class="rb plus" aria-label="Plus">+</button>`;row.querySelector(".plus").onclick=()=>{counts[k]=get(k)+1;save();render()};row.querySelector(".minus").onclick=()=>{counts[k]=Math.max(0,get(k)-1);save();render()};card.appendChild(row)});app.appendChild(card)})}
function buildData(){let data={};groups.forEach(g=>g.items.forEach(n=>data[n]=get(g.title+"|"+n)));return data}
function buildText(){return groups.map(g=>g.title+"\n"+g.items.map(n=>{const sep=(n==="G-DEG"||n==="G-IAM")?": ":" : ";return n+sep+get(g.title+"|"+n)}).join("\n")).join("\n")}
function toast(m,ok=false){const t=document.getElementById("toast");t.textContent=m;t.style.color=ok?"#17843b":"var(--red)";setTimeout(()=>{t.textContent=""},4000)}
document.getElementById("copyBtn").onclick=async()=>{const text=buildText();try{await navigator.clipboard.writeText(text);toast("✓ Copié",true)}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("✓ Copié",true)}catch(_){toast("Échec de la copie")}ta.remove()}};
const modal=document.getElementById("loginModal");
document.getElementById("sendBtn").onclick=()=>{document.getElementById("username").value="";document.getElementById("password").value="";modal.classList.add("show");setTimeout(()=>document.getElementById("username").focus(),100)};
document.getElementById("cancelLogin").onclick=()=>modal.classList.remove("show");modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show")});
document.getElementById("loginBtn").onclick=async()=>{
 const username=document.getElementById("username").value.trim();
 const password=document.getElementById("password").value;
 if(!username||!password){toast("Veuillez remplir les deux champs.");return}
 if(!GOOGLE_SCRIPT_URL||GOOGLE_SCRIPT_URL.includes("COLLEZ_ICI")){toast("URL Google Apps Script non configurée.");return}

 const btn=document.getElementById("loginBtn");btn.disabled=true;btn.textContent="Envoi...";

 // ✅ Form-urlencoded => Apps Script remplit e.parameter correctement
 const formBody = new URLSearchParams({
   action: "saveSituation",
   username: username,
   password: password,
   situation: JSON.stringify(buildData()),
   clientDate: new Date().toISOString()
 }).toString();

 try{
   const response = await fetch(GOOGLE_SCRIPT_URL, {
     method: "POST",
     headers: {"Content-Type": "application/x-www-form-urlencoded;charset=utf-8"},
     body: formBody,
     redirect: "follow"
   });

   const raw = await response.text();
   let result;
   try { result = JSON.parse(raw); }
   catch(_) {
     console.error("Réponse non-JSON:", raw);
     toast("✗ Réponse invalide du serveur.");
     return;
   }

   if(result.success){
     modal.classList.remove("show");
     toast("✓ Situation envoyée avec succès",true);
   } else {
     toast("✗ " + (result.message || "Nom ou password incorrect."));
   }
 }catch(e){
   console.error(e);
   toast("✗ Impossible de contacter Google Sheets. Vérifiez l'URL et le déploiement.");
 }finally{
   btn.disabled=false;btn.textContent="Envoyer";
 }
};
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click()});
const resetBtn=document.getElementById("resetBtn");let armTimer=null;function disarm(){resetBtn.classList.remove("armed");resetBtn.textContent="Remettre tout à zéro";clearTimeout(armTimer);armTimer=null}function doReset(){counts={};try{localStorage.removeItem("sit_counts")}catch(e){}save();render();disarm();toast("✓ Remis à zéro",true)}resetBtn.addEventListener("click",()=>{if(armTimer){doReset();return}resetBtn.classList.add("armed");resetBtn.textContent="Appuyer à nouveau pour confirmer";armTimer=setTimeout(disarm,3500)});
render();
</script>
</body>
</html>
