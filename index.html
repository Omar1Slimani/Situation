<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Situation de jour</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.png" type="image/png">
</head>
<body>
<header>
  <div class="header-content">
    <div class="header-text">
      <div class="brand">Maroc Telecom</div>
      <h1>Situation de jour</h1>
      <div class="date" id="date"></div>
    </div>
    <img class="brand-icon" src="logo.png" alt="Icône Maroc Telecom">
  </div>
</header>
<div class="wrap">
  <div id="app"></div>
  <button class="copy" id="copyBtn">Copier la situation</button>
  <div class="toast" id="toast"></div>
  <button class="reset" id="resetBtn">Remettre tout à zéro</button>
</div>
<script src="script.js"></script>
</body>
</html>
